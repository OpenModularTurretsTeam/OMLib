// Forge 1.12.2 build: RetroFuturaGradle (the maintained 1.12.2 toolchain) on current Gradle. Gradle runs on Java 17+,
// the mod is compiled and tested with the Java 8 toolchain. The OMTTeam 1.12 workspace builds this file too.
plugins {
    id "java"
    id "maven-publish"
    id "com.gtnewhorizons.retrofuturagradle"
}

// version, tests, core isolation, coverage, PIT, dependency map, changelog tasks, source tokens
apply from: file("gradle/mod-common.gradle")
// local releases to CurseForge and Modrinth (./gradlew release), see gradle/release.gradle
apply from: file("gradle/release.gradle")

group = group_id
base.archivesName = "${mod_id}-${minecraft_version}"

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        // Azul covers the most platforms for Java 8 toolchains
        vendor = JvmVendorSpec.AZUL
    }
}

sourceSets.main.java.srcDir "src/api/java"

minecraft {
    mcVersion = minecraft_version
    mcpMappingChannel = mcp_mapping_channel
    mcpMappingVersion = mcp_mapping_version
    username = "Developer"
}

// the tokens FG2's `replace` filled in (gradle/mod-common.gradle)
sourceTokens["@VERSION@"] = version.toString()

repositories {
    maven { url = "https://maven.blamejared.com/" }  // JEI, Tesla
    maven { url = "https://maven.covers1624.net/" }  // RedstoneFlux
    maven { url = "https://maven.cil.li/" }          // OpenComputers
    maven { url = "https://modmaven.dev/" }          // The One Probe
    maven {
        url = "https://maven.tehnut.info/"            // Hwyla
        // only Hwyla: the site answers unknown paths (e.g. Forge's Scala libraries) with an HTML page
        content { includeGroup "mcp.mobius.waila" }
    }
}

dependencies {
    // @ParametersAreNullableByDefault (the JSR-305 of Minecraft's libraries is older than FG2's)
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    implementation rfg.deobf("mezz.jei:jei_${minecraft_version}:${jei_version}:api")
    implementation rfg.deobf("cofh:RedstoneFlux:${minecraft_version_short}-${redstoneflux_version}:deobf")
    implementation "net.darkhax.tesla:Tesla-${minecraft_version_short}:${tesla_version}"
    implementation rfg.deobf("mcp.mobius.waila:Hwyla:${hwyla_version}_${minecraft_version}:api")
    implementation rfg.deobf("mcjty.theoneprobe:TheOneProbe-${minecraft_version_short}:${minecraft_version_short}-${top_version}")
    // compile only: OpenComputers crashes at runtime without AE2
    compileOnly rfg.deobf("li.cil.oc:OpenComputers:MC${minecraft_version_short}.1-${oc_version}")
}

processResources {
    def props = [version: version.toString(), mcversion: minecraft_version]
    inputs.properties(props)
    filesMatching("mcmod.info") { expand(props) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

// reobfJar (SRG names) is the jar players install; jar is the dev jar (MCP names)
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group_prefix
            artifactId = mod_id
            version = "${minecraft_version}-${project.version}"
            artifact tasks.reobfJar
            artifact(tasks.jar) { classifier = "dev" }
            artifact tasks.sourcesJar
        }
    }
    repositories {
        mavenLocal()
    }
}

// OMT and OMPD build their releases against this OMLib release from mavenLocal
tasks.named("release") { dependsOn "publishToMavenLocal" }
tasks.named("publishToMavenLocal") { dependsOn "build" }
