// Forge 1.12.2 build: RetroFuturaGradle (the maintained 1.12.2 toolchain) on current Gradle. Gradle runs on Java 17+,
// the mod is compiled and tested with the Java 8 toolchain. The OMTTeam 1.12 workspace builds this file too.
plugins {
    id "java-library"
    id "maven-publish"
    id "com.gtnewhorizons.retrofuturagradle"
}

// version, tests, core isolation, coverage, PIT, dependency map, changelog tasks, source tokens
apply from: file("gradle/mod-common.gradle")
// local releases to CurseForge and Modrinth (./gradlew release), see gradle/release.gradle
apply from: file("gradle/release.gradle")

group = group_id
// jars: <archives_base_name>-<version>-mc<minecraft_version>-forge[-dev|-sources].jar (name, version, Minecraft, loader),
// as on 1.20.1+; the release title on CurseForge and Modrinth is the jar name without ".jar" (gradle/release.gradle)
base.archivesName = archives_base_name
tasks.withType(Jar).configureEach {
    archiveVersion = "${project.version}-mc${minecraft_version}-forge"
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        // Azul covers the most platforms for Java 8 toolchains
        vendor = JvmVendorSpec.AZUL
    }
}

// The bundled ComputerCraft API (src/api/java): compiled against, but not part of the jar (as FG2's api source set);
// ComputerCraft itself provides it at runtime
sourceSets {
    api {
        java.srcDirs = ["src/api/java"]
        compileClasspath += configurations.compileClasspath
    }
    main.compileClasspath += api.output
    test.compileClasspath += api.output
    test.runtimeClasspath += api.output
}

minecraft {
    mcVersion = minecraft_version
    mcpMappingChannel = mcp_mapping_channel
    mcpMappingVersion = mcp_mapping_version
    username = "Developer"
}

// the tokens FG2's `replace` filled in (gradle/mod-common.gradle)
sourceTokens["@VERSION@"] = version.toString()

repositories {
    maven { url = "https://maven.blamejared.com/" }  // JEI, Tesla
    maven { url = "https://maven.covers1624.net/" }  // RedstoneFlux
    maven { url = "https://maven.cil.li/" }          // OpenComputers
    maven { url = "https://modmaven.dev/" }          // The One Probe
    maven {
        url = "https://cursemaven.com/"              // Hwyla from CurseForge (maven.tehnut.info no longer serves it)
        content { includeGroup "curse.maven" }
    }
    // the shared core (OpenModularCore, built by JitPack from its release tags); only the core comes from there
    maven {
        url = "https://jitpack.io"
        content { includeGroup "com.github.OpenModularTurretsTeam.OpenModularCore" }
    }
}

// The game rules (omtteam.omlib.core) come from the shared core, OpenModularCore, as the Java 8 module omlib-core-j8:
// the same rules as every other Minecraft version, downgraded from Java 17 with the Java 9+ API it uses as stubs under
// omtteam/omlib/jvmdg/. OMT, OMPD and OML compile against it through OMLib (api); the jars carry its classes, so
// players still install one OMLib jar.
configurations {
    // the core module alone (not transitive): its classes go into the OMLib jars
    coreBundle {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    api "com.github.OpenModularTurretsTeam.OpenModularCore:omlib-core-j8:${core_version}"
    coreBundle "com.github.OpenModularTurretsTeam.OpenModularCore:omlib-core-j8:${core_version}"
    // @ParametersAreNullableByDefault (the JSR-305 of Minecraft's libraries is older than FG2's)
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    implementation rfg.deobf("mezz.jei:jei_${minecraft_version}:${jei_version}:api")
    implementation rfg.deobf("cofh:RedstoneFlux:${minecraft_version_short}-${redstoneflux_version}:deobf")
    implementation "net.darkhax.tesla:Tesla-${minecraft_version_short}:${tesla_version}"
    // Hwyla (the full mod, deobfuscated); optional at runtime, the plugin is only loaded by Hwyla
    compileOnly rfg.deobf("curse.maven:hwyla-253449:${hwyla_curse_file_id}")
    implementation rfg.deobf("mcjty.theoneprobe:TheOneProbe-${minecraft_version_short}:${minecraft_version_short}-${top_version}")
    // compile only: OpenComputers crashes at runtime without AE2
    compileOnly rfg.deobf("li.cil.oc:OpenComputers:MC${minecraft_version_short}.1-${oc_version}")
}

processResources {
    def props = [version: version.toString(), mcversion: minecraft_version]
    inputs.properties(props)
    filesMatching("mcmod.info") { expand(props) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

// The core classes and their stubs are part of the dev jar, and so of reobfJar (made from it; the core names no
// Minecraft class, so reobfuscation leaves it alone): the only classes under omtteam/omlib/core and omtteam/omlib/jvmdg
tasks.named("jar", Jar) {
    def bundle = configurations.coreBundle
    inputs.files(bundle)
    from({ bundle.collect { zipTree(it) } }) {
        include "omtteam/omlib/core/**", "omtteam/omlib/jvmdg/**"
    }
}

// reobfJar (SRG names) is the jar players install; jar is the dev jar (MCP names), which OMT, OMPD and OML compile
// against standalone (with the core classes in it, so the publication names no dependency)
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group_prefix
            artifactId = mod_id
            version = "${minecraft_version}-${project.version}"
            artifact tasks.reobfJar
            artifact(tasks.jar) { classifier = "dev" }
            artifact tasks.sourcesJar
        }
    }
    repositories {
        mavenLocal()
    }
}

// OMT and OMPD build their releases against this OMLib release from mavenLocal
tasks.named("release") { dependsOn "publishToMavenLocal" }
tasks.named("publishToMavenLocal") { dependsOn "build" }
