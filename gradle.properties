# Gradle
org.gradle.jvmargs=-Xmx3G
# the nodes publish into one local Maven repository (one maven-metadata.xml for all of them): not in parallel
org.gradle.parallel=false

# Library (shared across all Minecraft versions). A mod of its own (mod id omlib), jar-in-jar'd into the OpenModular mods.
mod_id=omlib
mod_name=OMLib
mod_version=1.0.0-alpha.1
maven_group=omtteam.omlib
archives_base_name=omlib

# Shared dependencies
fabric_loader_version=0.19.5
junit_version=6.1.3
jacoco_version=0.8.15
# Mutation testing (./gradlew :1.21.1-fabric:pitest, on demand); the same versions as in the mods
pitest_version=1.30.0
pitest_junit5_version=1.2.3
# Thresholds of the pitest task, the state of 2026-11-06 (PIT rounds the percentages): it fails when fewer
# mutations are detected, less is covered or more are not detected than here. Lower pitest_max_surviving when a
# test kills one; raise it only for a survivor that no test can notice, listed with its reason in the docs.
pitest_mutation_threshold=99
pitest_coverage_threshold=96
pitest_max_surviving=6

# Publishing (./gradlew chiseledPublish): the mods bundle the library, so uploading it is optional. Tokens are NOT
# stored here (see the mods' gradle.properties). Empty project ids = that site is skipped.
release_type=alpha
curseforge_project_id=
modrinth_project_id=
