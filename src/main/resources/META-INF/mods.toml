# Forge 1.20.1.
modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "MIT (code), CC-BY-NC-SA-4.0 (art)"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Keridos"
description = "Library of the Open Modular mods: loader platform services, version compatibility, energy and item transfer, config and the camouflage menu."
displayURL = "https://github.com/OpenModularTurretsTeam/OMLib"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"
