# Runs ./gradlew check (every node's unit tests, verifyCoreIsolation, Spotless and the rest of check) on every push to
# any branch and on every pull request.
name: check

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # Gradle runs on 25; the nodes compile with 17 (1.20.1) and 21 (1.21.x). Installing them here spares foojay the
      # download; Gradle finds them through the JAVA_HOME_<n>_X64 variables (org.gradle.java.installations.fromEnv below).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # Caches ~/.gradle (wrapper, dependencies, Loom's Minecraft jars); written on pushes, read on pull requests
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check all nodes
        run: >
          ./gradlew check --continue --console=plain
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: versions/*/build/reports/
          if-no-files-found: ignore
